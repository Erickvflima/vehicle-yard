version: '3.9'

services:
  postgres:
    image: postgres:18
    container_name: vehicle-yard-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vehicleYard
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - vehicle-yard-net

volumes:
  postgres_data:

networks:
  vehicle-yard-net:
